[project]
name = "glados-checkin"
version = "2.0.0"
description = "GLaDOS 自动签到脚本 — 重构版"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "python-dotenv>=1.0.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-v", "--tb=short", "--strict-markers"]