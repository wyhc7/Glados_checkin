name: GLaDOS Auto Checkin v2

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "imgs/**"
      - "docs/**"
      - ".env.example"
  schedule:
    # UTC 1:17 / 7:17 → 北京时间 9:17 / 15:17
    # 避开整点：GitHub 机房整点出口最挤，GLaDOS 更容易回 code=-2
    - cron: "17 1,7 * * *"

# 同一时刻只允许一个签到任务，避免两个 workflow 用同一 cookie 并发（会话互顶）
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: glados checkin
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: ["3.13"]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin
        id: checkin
        run: python -m src.main
        env:
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}
          GLADOS_PUSH_CHANNEL: ${{ secrets.GLADOS_PUSH_CHANNEL }}
          GLADOS_PUSH_TOKEN: ${{ secrets.GLADOS_PUSH_TOKEN }}
          GLADOS_DOMAINS: ${{ secrets.GLADOS_DOMAINS }}
          GLADOS_RETRY_MAX: ${{ secrets.GLADOS_RETRY_MAX }}
          GLADOS_RETRY_BACKOFF: ${{ secrets.GLADOS_RETRY_BACKOFF }}
          # 可选：自建/住宅代理，机房 IP 被风控时填上（空值会被 requests 忽略）
          HTTPS_PROXY: ${{ secrets.GLADOS_PROXY }}
          HTTP_PROXY: ${{ secrets.GLADOS_PROXY }}
        # 退出码 2 = 签到失败（多半是 cookie 失效），不算工作流崩溃：
        # 保留日志与推送，但不要让整个 job 标红。
        continue-on-error: true

      - name: Fail on script error
        # 只把真正的脚本异常（退出码 1）当失败
        if: steps.checkin.outcome == 'failure'
        run: exit 1

      - name: Keep alive
        uses: liskin/gh-workflow-keepalive@v1

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 7
          delete_run_by_conclusion_pattern: success